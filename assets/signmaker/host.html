<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SignMaker Host</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f5f5;
    }
    #frame {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #status {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 2;
      display: none;
    }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite"></div>
  <iframe id="frame" title="Editor SignWriting SignMaker" allow="clipboard-read; clipboard-write"></iframe>
  <script>
(function () {
  var CHANNEL = 'FlutterSignMaker';
  var frame = document.getElementById('frame');
  var statusEl = document.getElementById('status');
  var ready = false;

  function showStatus(text) {
    statusEl.textContent = text || '';
    statusEl.style.display = text ? 'block' : 'none';
  }

  function postToFlutter(payload) {
    try {
      if (window[CHANNEL] && typeof window[CHANNEL].postMessage === 'function') {
        window[CHANNEL].postMessage(JSON.stringify(payload));
        return;
      }
    } catch (e) {}
    // Fallback for browsers / tests
    console.log('SignMakerHost', payload);
  }

  function buildEditorUrl(params) {
    var query = [];
    var ui = (params && params.ui) || 'ptBR';
    var alphabet = (params && params.alphabet) || 'bzs';
    query.push('ui=' + encodeURIComponent(ui));
    query.push('alphabet=' + encodeURIComponent(alphabet));
    if (params && params.fsw) {
      query.push('fsw=' + encodeURIComponent(params.fsw));
    }
    if (params && params.swu) {
      query.push('swu=' + encodeURIComponent(params.swu));
    }
    if (params && params.grid != null) {
      query.push('grid=' + encodeURIComponent(String(params.grid)));
    }
    return 'index.html#?' + query.join('&');
  }

  function editorWindow() {
    return frame.contentWindow;
  }

  function collectResult() {
    var w = editorWindow();
    if (!w || !w.signmaker || !w.signmaker.vm) {
      return { error: 'editor_not_ready' };
    }
    var fsw = '';
    var swu = '';
    var png = null;
    try {
      fsw = w.signmaker.vm.fswnorm() || '';
      swu = w.signmaker.vm.swunorm() || '';
    } catch (e) {
      return { error: 'collect_failed', detail: String(e) };
    }
    try {
      if (fsw && w.ssw && typeof w.ssw.png === 'function') {
        var styling = '';
        try {
          styling = w.signmaker.vm.styling() || '';
        } catch (eStyle) {
          styling = '';
        }
        png = w.ssw.png(fsw + styling, {
          size: 1,
          pad: 8,
          line: 'black',
          fill: 'white',
          back: 'white',
          colorize: true
        }) || null;
        if (png && png.length > 400000) png = null;
      }
    } catch (e) {
      png = null;
    }
    return {
      signmaker: 'save',
      fsw: fsw,
      swu: swu,
      png: png
    };
  }

  function sendLoad(params) {
    var w = editorWindow();
    if (!w || typeof w.setS !== 'function') {
      postToFlutter({ signmaker: 'error', error: 'editor_not_ready' });
      return;
    }
    var payload = {};
    if (params.ui) payload.ui = params.ui;
    if (params.alphabet) payload.alphabet = params.alphabet;
    if (params.fsw) payload.fsw = params.fsw;
    if (params.swu) payload.swu = params.swu;
    w.setS(payload);
    postToFlutter({ signmaker: 'loaded' });
  }

  window.SignMakerHost = {
    load: function (json) {
      var params = {};
      try {
        params = typeof json === 'string' ? JSON.parse(json) : (json || {});
      } catch (e) {
        postToFlutter({ signmaker: 'error', error: 'invalid_load_payload' });
        return;
      }
      if (!ready) {
        frame.src = buildEditorUrl(params);
        return;
      }
      sendLoad(params);
    },
    save: function () {
      var result = collectResult();
      if (result.error) {
        postToFlutter({ signmaker: 'error', error: result.error, detail: result.detail || null });
        return;
      }
      postToFlutter(result);
    },
    cancel: function () {
      postToFlutter({ signmaker: 'cancel' });
    }
  };

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.signmaker === 'save') {
      var enriched = collectResult();
      if (!enriched.error) {
        postToFlutter(enriched);
      } else {
        postToFlutter({
          signmaker: 'save',
          fsw: data.fsw || '',
          swu: data.swu || '',
          svg: null
        });
      }
      return;
    }
    if (data.signmaker === 'cancel') {
      postToFlutter({ signmaker: 'cancel' });
    }
  }, false);

  frame.addEventListener('load', function () {
    ready = true;
    showStatus('');
    postToFlutter({ signmaker: 'ready' });
  });

  showStatus('Carregando editor SignWriting…');
  frame.src = buildEditorUrl({ ui: 'ptBR', alphabet: 'bzs' });
})();
  </script>
</body>
</html>
